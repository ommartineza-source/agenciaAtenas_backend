server.address=127.0.0.1
spring.datasource.url=jdbc:mysql://${ATENAS_DB_HOST:127.0.0.1}:${ATENAS_DB_PORT:3306}/${ATENAS_DB_NAME:agencia_atenas}?createDatabaseIfNotExist=true
spring.datasource.username=${ATENAS_DB_USER:root}
spring.datasource.password=${ATENAS_DB_PASSWORD:}
spring.sql.init.mode=always
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
spring.data.jpa.repositories.enabled=false
